[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tawn"
version = "0.3.0"
description = "Tawn — the personal digital twin. Local-first memory and context core for your work, wealth, research, and academic life."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Testimony Adekoya", email = "testimonyadekoya.02@gmail.com" },
]
keywords = ["ai", "personal-ai", "digital-twin", "memory", "mcp", "rag", "local-first", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    # core — always installed
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "typer>=0.12",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "rich>=13.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "keyring>=25.0",
    "python-frontmatter>=1.1",
    "rapidfuzz>=3.0",
    "watchfiles>=0.21",
]

[project.optional-dependencies]
# individual provider extras
anthropic  = ["anthropic>=0.100"]
openai     = ["openai>=2.0"]
gemini     = ["google-genai>=1.0"]
ollama     = ["ollama>=0.4"]
vectors    = ["pgvector>=0.3"]
mcp        = ["fastmcp>=2.0"]

# Document parsing. Office and OpenDocument formats need nothing — they are
# ZIP+XML, which the stdlib reads. These cover the formats it genuinely cannot.
parsing = [
    "pymupdf>=1.24",      # PDF — fastest, best layout fidelity
    "pypdf>=4.0",         # PDF fallback, pure Python
    "beautifulsoup4>=4.12",  # better HTML text extraction than regex
    "striprtf>=0.0.26",   # RTF
    "chardet>=5.2",       # encoding detection for legacy text
]
# OCR — tier 2, for scanned pages and images. Needs the system `tesseract`
# binary as well: `apt install tesseract-ocr` / `brew install tesseract`.
ocr = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "pymupdf>=1.24",      # rasterises PDF pages for OCR
]

# convenience meta-extras
providers  = ["anthropic>=0.100", "openai>=2.0", "google-genai>=1.0", "ollama>=0.4"]
full       = [
    "anthropic>=0.100", "openai>=2.0", "google-genai>=1.0",
    "ollama>=0.4", "pgvector>=0.3", "fastmcp>=2.0",
    "pymupdf>=1.24", "pypdf>=4.0", "beautifulsoup4>=4.12",
    "striprtf>=0.0.26", "chardet>=5.2",
    "pytesseract>=0.3.10", "Pillow>=10.0",
]
dev = ["pytest>=8.0", "respx>=0.21"]

[project.urls]
Homepage = "https://github.com/tawn-hq/tawn"
Repository = "https://github.com/tawn-hq/tawn"
"Bug Tracker" = "https://github.com/tawn-hq/tawn/issues"

[project.scripts]
tawn = "tawn.cli:app"

[project.entry-points."tawn.domains"]
wealth = "tawn.domains.wealth:register"
work = "tawn.domains.work:register"
research = "tawn.domains.research:register"
academic = "tawn.domains.academic:register"
hobby = "tawn.domains.hobby:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tawn = [
    "web/dist/**/*",
    "web/dist/*",
    # migrations must ship in the wheel — resolving them from the repo root
    # works in an editable checkout and breaks for `pip install tawn`
    "migrations/alembic.ini",
    "migrations/env.py",
    "migrations/script.py.mako",
    "migrations/versions/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.tawn.scripts]
build-web = "cd frontend && npm install && npm run build"
