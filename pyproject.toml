[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tawn"
version = "0.0.1"
description = "Tawn — the personal digital twin. Capability-gated memory core."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "typer>=0.12",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "rich>=13.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "keyring>=25.0",
    "google-genai>=1.0",
    "ollama>=0.4",
    "anthropic>=0.100",
    "openai>=2.0",
    "pgvector>=0.3",
    "fastmcp>=2.0",
    "python-frontmatter>=1.1",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]

[project.scripts]
tawn = "tawn.cli:app"

[project.entry-points."tawn.domains"]
wealth = "tawn.domains.wealth:register"
work = "tawn.domains.work:register"
research = "tawn.domains.research:register"
academic = "tawn.domains.academic:register"
hobby = "tawn.domains.hobby:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.tawn.scripts]
build-web = "cd web && npm install && npm run build"
