# Pipeline logic lives in the org repo so it is defined once:
# https://github.com/tawn-hq/.github/blob/main/.github/workflows/python-ci.yml
name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    uses: tawn-hq/.github/.github/workflows/python-ci.yml@main
    with:
      python-versions: '["3.12", "3.13"]'
      needs-postgres: true
      install-extras: dev,providers,vectors,mcp
      build-frontend: true
