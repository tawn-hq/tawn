# Pipeline logic lives in the org repo so it is defined once:
# https://github.com/tawn-hq/.github/blob/main/.github/workflows/python-publish.yml
#
# This file's name and the `pypi` environment are both part of what PyPI's
# trusted publisher matches on. Renaming either breaks publishing until the
# trusted publisher config on PyPI is updated to match.
name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    uses: tawn-hq/.github/.github/workflows/python-publish.yml@main
    with:
      python-version: "3.12"
      build-frontend: true
      frontend-dist-target: src/tawn/web/dist
      environment: pypi
    permissions:
      contents: read
      id-token: write  # OIDC trusted publishing
