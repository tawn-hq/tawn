# Alembic config for Tawn.
#
# Lives inside the package (not at the repo root) so `pip install tawn`
# ships it — a repo-root config resolves fine in an editable checkout and
# is simply absent from a wheel.
#
# `script_location` and `sqlalchemy.url` are both set programmatically by
# `tawn.db._alembic_cfg()`; the values here are placeholders for anyone
# running the `alembic` CLI directly from a source checkout.

[alembic]
script_location = %(here)s
prepend_sys_path = .
version_path_separator = os
path_separator = os
sqlalchemy.url = sqlite+pysqlite:///:memory:

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
